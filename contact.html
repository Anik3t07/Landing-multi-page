<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniket - Contact</title>
    <meta name="description" content="Pricing — multi-page starter">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Landing multi page/styles.css">
</head>
<body>
    <!-- NAVBAR -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Aniket</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>


                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="/Landing multi page/Index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/Landing multi page/about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="/Landing multi page/projects.html">Work</a></li>
                        <li class="nav-item"><a class="nav-link" href="/Landing multi page/pricing.html">Pricing</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/Landing multi page/contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="container py-5">
        <h1 class="h4 fw-bold mb-3">Get in touch</h1>
        <div class="row g-4">
            <div class="col-md-6">
                <p class="text-muted">Interested in working together? Send a message and I’ll reply within 2 business days.</p>
                    <ul class="list-unstyled small text-muted">
                        <li><strong>Email:</strong> hello@aniket.dev</li>
                        <li><strong>Location:</strong> India</li>
                    </ul>
            </div>


            <div class="col-md-6">
                <form class="contact-form" action="https://formspree.io/f/moqynqak" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@mail.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Talk to me..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </main>


    <footer class="site-footer py-4 bg-dark text-light mt-5">
        <div class="container text-center">
            <p class="mb-0">© <span id="year">2025</span> Aniket. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
